function tabbar(route) {
  const tab = (path, name, label) => el('a', { href: '#' + path, 'aria-current': route.tab === name ? 'page' : null }, label);
  return el('nav', { class: 'tabbar', 'aria-label': 'Main' }, [tab('/', 'board', 'Board'), tab('/insights', 'insights', 'Insights'), tab('/shelf', 'shelf', 'Shelf')]);
}

// Draws the current screen from scratch. Screens with text fields are never redrawn on their own
// (callers check isFormRoute() first). Addresses that can't be shown redirect without adding history,
// and a screen that fails to draw shows the error instead of a blank page.
function render() {
  const root = document.getElementById('app');
  if (!root) return;
  const now = new Date();
  let route = currentRoute();
  let notice = '';
  if (!APP.doc && !route.noDoc) route = redirectTo('/recovery');
  else if (route.unknown) { notice = 'That page does not exist, so here is the board.'; route = redirectTo('/'); }
  else if (route.goalId && !goalById(APP.doc, route.goalId)) { notice = 'That goal no longer exists.'; route = redirectTo('/'); }
  else if (APP.doc && route.name === 'checkin') route = redirectTo(checkinPath(checkinTargetWeek(APP.doc, now)));
  else if (APP.doc && (route.name === 'checkinStep' || route.name === 'checkinFocus')) {
    const next = checkinRedirect(APP.doc, route);
    if (next) route = redirectTo(next);
  }
  const ctx = { doc: APP.doc, store: APP.store, now, today: todayLocal(now) };
  document.body.classList.toggle('has-nav', route.nav);
  root.textContent = '';
  root.appendChild(topbar(route));
  root.appendChild(el('div', { id: 'banners' }));
  const page = el('main', { id: 'page' });
  root.appendChild(page);
  if (route.nav) root.appendChild(tabbar(route));
  renderBanners();
  try {
    PAGES[route.name](page, route, ctx);
  } catch (e) {
    console.error(e);
    APP.lastError = String((e && (e.stack || e.message)) || e);
    page.textContent = '';
    page.appendChild(el('h1', { tabindex: '-1' }, 'Something went wrong'));
    page.appendChild(el('p', null, 'This screen could not be shown. Your saved data was not changed. Diagnostics, under Settings, has the details.'));
    page.appendChild(el('div', { class: 'why' }, APP.lastError));
  }
  APP.routeName = route.name;
  if (notice) toast(notice);
  applyPendingFocus();
}
// Swaps the address without adding a history entry and returns the screen it now points to.
function redirectTo(path) {
  try { history.replaceState({ depth: APP.depth }, '', '#' + path); } catch (e) { /* the screen is still right */ }
  closeDialog();
  return routeFor(path);
}
function applyPendingFocus() {
  const ids = APP.pendingFocus;
  APP.pendingFocus = null;
  if (!Array.isArray(ids)) return;
  for (const id of ids) {
    const t = document.getElementById(id);
    if (t && !t.disabled) {
      try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); }
      if (typeof t.scrollIntoView === 'function') t.scrollIntoView({ block: 'nearest' });
      return;
    }
  }
}

/* Screens. Each takes (page, route, ctx) and adds its content, starting with a focusable h1. */
const PAGES = {};
  /* Board (spec 6): welcome on first run, the check-in card, focus goals first, then the rest. */
PAGES.board = (page, route, ctx) => {
  const d = ctx.doc;

  }

  }

    full ? el('button', { class: 'btn primary', type: 'button', disabled: true }, 'Add a goal') : el('a', { class: 'btn primary', href: '#/goal/new' }, 'Add a goal'),

// The weekly check-in card (spec 6): start, resume or done, with the week's dates.
function checkinCard(d, ctx) {
  const draft = draftCheckin(d);
  const active = activeGoals(d);
  let text;
  let link;
  if (draft) {
    const answered = active.filter(g => draft.items.some(it => it.goalId === g.id && it.progress !== null)).length;
    text = 'In progress for ' + weekRange(draft.weekKey, ctx.today) + ': ' + answered + ' of ' + active.length + ' answered.';
    link = el('a', { class: 'btn primary', href: '#' + checkinPath(draft.weekKey) }, 'Resume check-in');
  } else {
    const week = defaultCheckinWeek(d, ctx.now);
    if (d.checkins.some(c => c.weekKey === week && c.completedAt !== null)) {
      text = 'Done for ' + weekRange(week, ctx.today) + '.';
      link = el('a', { class: 'btn', href: '#' + checkinPath(week) }, 'See answers');
    } else {
      text = 'For ' + weekRange(week, ctx.today) + '. About five minutes: one question per goal, then pick your focus.';
      link = el('a', { class: 'btn primary', href: '#' + checkinPath(week) }, 'Start check-in');
    }
  }
  return el('section', { class: 'card checkin' }, [el('h2', null, 'Weekly check-in'), el('p', null, text), el('div', { class: 'actions' }, link)]);
}

// One link per card, no buttons inside (spec 6). Overdue dates say so in words, not just in colour.
function goalCard(g, ctx, showStrip) {
  const today = ctx.today;
  const ms = currentMilestone(g);
  const kids = [
    el('div', { class: 'gc-top' }, [
      el('span', { class: 'gc-title' }, g.title),

/* Goal page (spec 6): fields, status, focus, milestone, next action, weekly notes, history, actions. */

function milestoneCard(g, base, today, closed) {
  const ms = currentMilestone(g);
  const kids = [];
  if (ms) {
    const late = isDateOverdue(ms.dueDate, today);
    kids.push(el('p', { class: 'multiline' }, ms.text));
    if (ms.dueDate) kids.push(el('p', { class: 'small' + (late ? ' overdue' : ' muted') }, 'Due ' + fmtDay(ms.dueDate, today) + (late ? ' · overdue' : '')));
    kids.push(el('div', { class: 'actions' }, [
      el('a', { class: 'btn primary', href: '#' + base + '/milestone/done' }, 'Mark done'),
      el('a', { class: 'btn', href: '#' + base + '/milestone/edit' }, 'Edit'),
      el('a', { class: 'btn', href: '#' + base + '/milestone/replace' }, 'Replace'),
    ]));
  } else if (closed) {
    kids.push(el('p', { class: 'muted' }, 'No current milestone.'));
  } else {
    kids.push(el('p', { class: 'muted' }, 'No current milestone. Make it the next chunk of this goal, something you can finish in 4 to 12 weeks.'));
    kids.push(el('div', { class: 'actions' }, el('a', { class: 'btn primary', href: '#' + base + '/milestone/add' }, 'Add a milestone')));
  }
  const past = g.milestones.filter(m => m.status !== 'current').reverse();
  if (past.length) {
    kids.push(el('p', { class: 'small muted' }, 'Earlier milestones'));
    kids.push(el('ul', { class: 'plain' }, past.map(m => el('li', null, [
      el('div', { class: 'multiline' }, m.text),
      el('div', { class: 'small muted' }, (m.status === 'done' ? 'Done' : 'Dropped') + (m.closedAt ? ' ' + fmtWhen(m.closedAt) : '')),
    ]))));
  }
  return card('Milestone', kids);
}

// Inline save (spec 6). What you type is kept in APP.naDraft, so a redraw never loses it.
function nextActionCard(g) {
  const typed = APP.naDraft[g.id];
  const input = el('input', { type: 'text', id: 'f-next', maxlength: String(LIMITS.nextAction), autocomplete: 'off', enterkeyhint: 'done', 'aria-label': 'Next action' });
  input.value = typed !== undefined ? typed : g.nextAction;
  const save = el('button', { class: 'btn primary', type: 'submit' }, 'Save');
  const refresh = () => { save.disabled = cleanLine(input.value) === cleanLine(g.nextAction); };
  input.addEventListener('input', () => { APP.naDraft[g.id] = input.value; refresh(); });
  refresh();
  const form = el('form', {
    class: 'inline-form', novalidate: true,
    onsubmit: e => {
      e.preventDefault();
      if (save.disabled) return;
      if (commit('setNextAction', { goalId: g.id, nextAction: input.value }, { quiet: true }) === null) return;
      delete APP.naDraft[g.id];
      toast('Next action saved.');
      render();
    },
  }, [input, save]);
  return card('Next action', [form, el('p', { class: 'hint' }, 'One concrete step you can take soon. It shows on the board.')]);
}

// Listed in the order it was written, newest first, never sorted by timestamp (spec 5.2).
function historyCard(d, g) {
  const all = d.changes.filter(c => c.goalId === g.id).reverse();
  const minorCount = all.filter(c => c.minor).length;
  const shown = APP.showMinor ? all : all.filter(c => !c.minor);
  const kids = [shown.length ? el('ol', { class: 'timeline' }, shown.map(c => historyItem(c))) : el('p', { class: 'muted' }, 'No history yet.')];
  if (minorCount) {
    kids.push(el('button', { class: 'linkbtn', type: 'button', onclick: () => { APP.showMinor = !APP.showMinor; render(); } },
      APP.showMinor ? 'Hide minor edits' : 'Show minor edits (' + minorCount + ')'));
  }
  return card('History', kids);
}
function historyItem(c) {
  return el('li', null, [
    el('div', { class: 'tl-meta' }, [fmtStamp(c.at), c.minor ? el('span', { class: 'tag' }, 'minor') : null]),
    el('strong', null, KIND_LABEL[c.kind] || c.kind),
    c.diffs.length ? el('ul', { class: 'tl-diffs' }, c.diffs.map(df => el('li', { class: 'multiline' }, diffText(c.kind, df)))) : null,
    c.reason ? el('p', { class: 'tl-reason' }, 'Reason: ' + c.reason) : null,
  ]);
}
function diffText(kind, df) {
  const label = FIELD_LABELS[df.field] || df.field;
  const show = v => fieldValueText(df.field, v);
  if (df.from === null) return label + ': ' + show(df.to);
  if (df.to === null) return label + ': ' + show(df.from) + (kind === 'milestone-done' ? ' (done)' : ' → removed');
  return label + ': ' + show(df.from) + ' → ' + show(df.to);
}
function fieldValueText(fieldName, v) {
  if (v === null || v === '') return '—';
  if (fieldName === 'targetMonth') return fmtYM(v) || v;
  if (fieldName === 'revisitOn' || fieldName === 'milestoneDue') return fmtYMD(v) || v;
  if (fieldName === 'status') return STATUS_LABEL[v] || v;
  return v;
}
function statusActions(g, base) {
  const link = (action, label, primary) => el('a', { class: 'btn' + (primary ? ' primary' : ''), href: '#' + base + '/status/' + action }, label);
  if (g.status === 'active') return [link('park', 'Park'), link('achieve', 'Mark achieved'), link('drop', 'Drop')];
  if (g.status === 'parked') return [link('reactivate', 'Reactivate', true), link('repark', 'Change revisit date'), link('drop', 'Drop')];
  return [link('reactivate', 'Reactivate')];
}

// Adds or removes focus. With three already in focus, a pop-up asks which one to swap out (spec 5.3).
function toggleFocus(goalId) {
  const g = goalById(APP.doc, goalId);
  if (!g) return;
  if (g.inFocus) { commit('setFocus', { goalId, on: false }); return; }
  const focused = focusGoals(APP.doc);
  if (focused.length < MAX_FOCUS) { commit('setFocus', { goalId, on: true }); return; }
  openDialog({
    title: 'Swap a focus goal',
    text: MAX_FOCUS + ' goals are already in focus. Choose one to take out of focus:',
    nodes: focused.map(f => el('button', {
      class: 'btn choice', type: 'button',
      onclick: () => { closeDialog(); commit('setFocus', { goalId, on: true, replaceGoalId: f.id }); },
    }, f.title)),
    buttons: [{ label: 'Cancel' }],
  });
}
// After deleting, the goal's page is replaced in history, so Back skips it.
function confirmDelete(goalId, title) {
  openDialog({
    title: 'Delete this goal for good?',
    text: '"' + title + '" will be removed along with its history and check-in answers. This cannot be undone. To keep it out of the way instead, drop it.',
    buttons: [
      { label: 'Cancel' },
      {
        label: 'Delete', kind: 'danger',
        run: () => {
          if (commit('deleteGoal', { goalId }, { quiet: true }) === null) return;
          if (APP.store) APP.store.removeDraft(goalId);
          delete APP.naDraft[goalId];
          toast('Goal deleted.');
          replaceRoute('/');
        },
      },
    ],
  });
}

/* Goal editor (spec 6): title, why, done looks like, target month. A draft is saved on every keystroke,
   and reopening offers Restore or Discard. Edits list what changed and take an optional reason. */
let newGoalFormId = null;   // the id the next new goal gets; kept until it is saved, so a repeated Save adds nothing
PAGES.goalNew = (page, route, ctx) => goalEditor(page, ctx, null);
PAGES.goalEdit = (page, route, ctx) => goalEditor(page, ctx, goalById(ctx.doc, route.goalId));

function toTargetMonth(f) {
  if (!f.month && !f.year) return null;
  if (f.month && f.year) return f.year + '-' + f.month;
  return 'incomplete';                                     // refused on save with a clear message
}
// The logged fields that differ from the saved goal, after the same cleaning the save applies.
function editorChanges(saved, f) {
  const out = [];
  if (cleanLine(f.title) !== cleanLine(saved.title)) out.push('title');
  if (cleanText(f.why) !== cleanText(saved.why)) out.push('why');
  if (cleanText(f.doneLooksLike) !== cleanText(saved.doneLooksLike)) out.push('doneLooksLike');
  if (toTargetMonth(f) !== saved.targetMonth) out.push('targetMonth');
  return out;
}
function draftHasContent(f) {
  return [f.title, f.why, f.doneLooksLike].some(v => cleanText(v) !== '') || !!f.month || !!f.year;
}
function goalEditor(page, ctx, goal) {
  const isNew = !goal;
  const key = isNew ? null : goal.id;
  const saved = isNew
    ? { title: '', why: '', doneLooksLike: '', targetMonth: null }
    : { title: goal.title, why: goal.why, doneLooksLike: goal.doneLooksLike, targetMonth: goal.targetMonth };
  if (isNew && !newGoalFormId) newGoalFormId = newId();
  const formGoalId = newGoalFormId;
  const backPath = isNew ? '/' : goalPath(goal.id);
  page.appendChild(el('h1', { tabindex: '-1' }, isNew ? 'New goal' : 'Edit goal'));
  if (!isNew) page.appendChild(el('p', { class: 'sub' }, goal.title));

  const title = el('input', { type: 'text', id: 'f-title', maxlength: String(LIMITS.title), autocomplete: 'off', enterkeyhint: 'next' });
  const why = el('textarea', { id: 'f-why', class: 'short', maxlength: String(LIMITS.why) });
  const done = el('textarea', { id: 'f-done', class: 'short', maxlength: String(LIMITS.doneLooksLike) });
  const month = el('select', { id: 'f-month', 'aria-label': 'Target month' },
    [el('option', { value: '' }, 'Month')].concat(MONTH_NAMES.map((n, i) => el('option', { value: pad2(i + 1) }, n))));
  const year = el('select', { id: 'f-year', 'aria-label': 'Target year' }, [el('option', { value: '' }, 'Year')]);
  const addYear = y => {
    if (!y || Array.from(year.options).some(o => o.value === y)) return;
    const after = Array.from(year.options).find(o => o.value && o.value > y);
    year.insertBefore(el('option', { value: y }, y), after || null);
  };
  const firstYear = Number(ctx.today.slice(0, 4));
  for (let y = firstYear; y <= firstYear + 15; y += 1) addYear(String(y));
  const reason = el('textarea', { id: 'f-reason', class: 'short', maxlength: String(LIMITS.reason) });
  const minor = el('input', { type: 'checkbox', id: 'f-minor' });

  const setValues = f => {
    title.value = isStr(f.title) ? f.title : '';
    why.value = isStr(f.why) ? f.why : '';
    done.value = isStr(f.doneLooksLike) ? f.doneLooksLike : '';
    month.value = isStr(f.month) && /^(0[1-9]|1[0-2])$/.test(f.month) ? f.month : '';
    const y = isStr(f.year) && /^\d{4}$/.test(f.year) ? f.year : '';
    addYear(y);
    year.value = y;
    reason.value = isStr(f.reason) ? f.reason : '';
  };
  const readFields = () => ({ title: title.value, why: why.value, doneLooksLike: done.value, month: month.value, year: year.value, reason: reason.value });
  setValues({
    title: saved.title, why: saved.why, doneLooksLike: saved.doneLooksLike,
    month: saved.targetMonth ? saved.targetMonth.slice(5, 7) : '', year: saved.targetMonth ? saved.targetMonth.slice(0, 4) : '', reason: '',
  });

  const changed = el('p', { class: 'small' });
  const changeBox = el('div', { class: 'changebox' }, [
    changed,
    field('Reason for the change (optional)', reason, 'Kept in the history with this edit.'),
    el('label', { class: 'check' }, [minor, 'Minor edit, hidden from history by default']),
  ]);

          replaceRoute('/');
        },
      },
    ],
  });
}

/* Diagnostics: version, storage, start-up, self-test, safety copies (download or restore), last error. */
function statusText() {
  const st = APP.store;
  if (!st) return 'Not started';
  if (st.mode === 'demo') return 'Demo: in memory only, nothing is saved';
  if (st.mode === 'memory') return 'Not saving: ' + st.memoryReason;
  return 'Saved in this browser, for this web address only';
}
function startupText() {
  const b = APP.boot;
  if (!b) return 'Not started';
  if (b.status === 'ok') return b.migrated ? 'Loaded and upgraded to the current format' : b.repaired ? 'Loaded after safe repairs' : 'Loaded normally';
  return { empty: 'Started with no saved data', demo: 'Demo data', newer: 'Saved by a newer version: left untouched', unreadable: 'Saved data could not be read: left untouched' }[b.status] || b.status;
}
function kb(chars) { return chars > 0 ? Math.max(1, Math.round(chars / 1024)) + ' KB' : '0 KB'; }

PAGES.diagnostics = page => {
  page.appendChild(el('h1', { tabindex: '-1' }, 'Diagnostics'));
  const b = APP.boot || {};
  if (b.status === 'unreadable' || b.status === 'newer') {
    page.appendChild(el('div', { class: 'notice' }, [
      el('p', null, 'Your saved data could not be loaded, so nothing was changed.'),
      el('div', { class: 'actions' }, el('a', { class: 'btn primary', href: '#/recovery' }, 'Open the recovery screen')),
    ]));
  }
  const st = APP.store;
  const rows = [
    ['App version', APP_VERSION],
    ['Data format', String(SCHEMA_VERSION)],
    ['Storage', statusText()],
    ['Start-up', startupText()],
    ['Persistent storage', APP.persist],
    ['Running as', displayMode()],
    ['Save counter', st && st.loadedRev !== null ? String(st.loadedRev) : 'Nothing saved yet'],
  ];
  if (APP.doc) {
    const s = docSummary(APP.doc);
    rows.push(['Last saved', st && st.loadedRev !== null ? fmtStamp(APP.doc.updatedAt) : 'Not yet']);
    rows.push(['Goals', s.goals + ' (' + s.active + ' active, ' + s.parked + ' parked, ' + s.achieved + ' achieved, ' + s.dropped + ' dropped)']);
    rows.push(['Check-ins', s.checkins + ' finished' + (s.drafts ? ', 1 unfinished' : '')]);
    rows.push(['History entries', String(s.changes)]);
  }
  if (st) {
    const u = st.usage();
    rows.push(['Space used', 'data ' + kb(u.dataChars) + ', safety copies ' + kb(u.safetyChars) + ', editor drafts ' + u.draftCount]);
  }
  page.appendChild(el('section', { class: 'card' }, [
    el('h2', null, 'Status'),
    el('dl', { class: 'kv' }, rows.flatMap(r => [el('dt', null, r[0]), el('dd', null, r[1])])),
  ]));

  const results = APP.selftest;
  const testCard = el('section', { class: 'card' }, [
    el('h2', null, 'Self-test'),
    el('p', { class: 'small muted' }, 'Checks dates, rules, actions, saving, backups and every screen on sample data held in memory. Your saved data is not read or changed.'),
    el('button', { class: 'btn primary', type: 'button', onclick: () => { APP.selftest = runSelfTest(); render(); } }, results ? 'Run again' : 'Run self-test'),
  ]);
  if (results) {
    const failed = results.filter(r => !r.pass).length;
    testCard.appendChild(el('p', { class: 'result ' + (failed ? 'bad' : 'good'), role: 'status' },
      failed ? failed + ' of ' + results.length + ' tests failed' : 'All ' + results.length + ' tests passed'));
    const ordered = results.filter(r => !r.pass).concat(results.filter(r => r.pass));
    testCard.appendChild(el('ol', { class: 'tests' }, ordered.map(r => el('li', { class: r.pass ? 'pass' : 'fail' }, [
      el('span', { class: 'mark', 'aria-hidden': 'true' }, r.pass ? '✓' : '✗'),
      el('span', { class: 'sr' }, r.pass ? 'Passed: ' : 'Failed: '),
      r.name,
      !r.pass && r.detail ? el('div', { class: 'why' }, r.detail) : null,
    ]))));
  }
  page.appendChild(testCard);

  const copies = st ? st.safetyCopies().slice().reverse() : [];
  page.appendChild(el('section', { class: 'card' }, [
    el('h2', null, 'Safety copies'),
    el('p', { class: 'small muted' }, 'Taken automatically before upgrades, repairs, restores and starting fresh. The newest ' + SAFETY_MAX + ' are kept, in this browser only.'),
    copies.length
      ? el('ul', { class: 'plain' }, copies.map(c => el('li', null, [
        el('div', null, fmtStamp(c.at) + (c.reason ? ': ' + c.reason : '')),
        el('div', { class: 'small muted' }, kb(c.raw.length)),
        el('div', { class: 'actions' }, [
          el('button', { class: 'btn', type: 'button', onclick: () => downloadText('compass-safety-copy-' + todayLocal(new Date(c.at)) + '.json', c.raw) }, 'Download'),
          el('button', { class: 'btn', type: 'button', onclick: () => { APP.pendingImport = { text: c.raw, source: 'the safety copy from ' + fmtStamp(c.at) }; navigate('/settings/backup'); } }, 'Restore'),
        ]),
      ])))
      : el('p', null, 'No safety copies yet.'),
  ]));

  if (APP.lastError) {
    page.appendChild(el('section', { class: 'card problem' }, [el('h2', null, 'Last error'), el('div', { class: 'why' }, APP.lastError)]));
  }
};
