<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<meta name="apple-mobile-web-app-title" content="Compass">
<title>Compass</title>
<style>
:root {
  --bg: #f6f5f2; --surface: #ffffff; --text: #1c1c1e; --muted: #5c5f66; --line: #dedbd4;
  --accent: #2c6b66; --on-accent: #ffffff;
  --danger: #a3221b; --danger-bg: #fdeceb; --warn: #6a4d00; --warn-bg: #fff3d4;
  --info: #1f4f4b; --info-bg: #e3f0ee; --good: #1d6b39; --bad: #a3221b;
  --radius: 12px; --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212; --surface: #1e1e1e; --text: #ececec; --muted: #a8a8ad; --line: #34343a;
    --accent: #7cc4bc; --on-accent: #0d2421;
    --danger: #ff9a92; --danger-bg: #3b1d1b; --warn: #f3d488; --warn-bg: #362c17;
    --info: #a9dcd5; --info-bg: #19302d; --good: #86d39c; --bad: #ff9a92;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.5; min-height: 100vh; min-height: 100dvh;
}
#app {
  max-width: 640px; margin: 0 auto; overflow-wrap: anywhere;
  padding: var(--s4) max(var(--s4), env(safe-area-inset-right)) calc(var(--s6) + env(safe-area-inset-bottom)) max(var(--s4), env(safe-area-inset-left));
}
h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 var(--s1); }
h1:focus { outline: none; }
h2 { font-size: 1.125rem; line-height: 1.3; margin: 0 0 var(--s2); }
p { margin: 0 0 var(--s3); }
.brand { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 var(--s1); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); margin: var(--s4) 0; }
.card.problem { border-color: var(--danger); }
.btn {
  font: inherit; font-size: 1rem; min-height: 44px; min-width: 44px; padding: var(--s2) var(--s4); margin: var(--s1) var(--s2) var(--s1) 0;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.banner { border-radius: var(--radius); padding: var(--s3) var(--s4); margin: 0 0 var(--s4); border: 1px solid transparent; }
.banner.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); font-weight: 600; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.info { background: var(--info-bg); color: var(--info); font-weight: 600; }
.banner .btn { margin: var(--s2) var(--s2) 0 0; }
dl.kv { display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; gap: var(--s1) var(--s4); margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }
ul.plain { list-style: none; padding: 0; margin: 0; }
ul.plain li { padding: var(--s3) 0; border-top: 1px solid var(--line); }
ul.plain li:first-child { border-top: 0; }
ul.errors { margin: 0 0 var(--s3); padding-left: 1.25rem; }
.result { font-weight: 600; margin-top: var(--s3); }
.result.good { color: var(--good); }
.result.bad { color: var(--bad); }
ol.tests { list-style: none; padding: 0; margin: var(--s3) 0 0; }
ol.tests li { padding: var(--s2) 0; border-top: 1px solid var(--line); }
.mark { display: inline-block; width: 1.5em; font-weight: 700; }
li.pass .mark { color: var(--good); }
li.fail .mark { color: var(--bad); }
.why { margin: var(--s1) 0 0 1.5em; font-size: 0.875rem; color: var(--muted); white-space: pre-wrap; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
textarea {
  display: block; width: 100%; min-height: 8rem; margin: var(--s2) 0; padding: var(--s2);
  font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap;
}
.toast {
  position: fixed; left: 50%; bottom: calc(var(--s5) + env(safe-area-inset-bottom)); transform: translateX(-50%);
  max-width: min(90vw, 560px); padding: var(--s3) var(--s4); border-radius: 10px;
  background: var(--text); color: var(--bg); opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.toast.show { opacity: 1; }

/* ---- Links, buttons, layout ---- */
a { color: var(--accent); }
a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; line-height: 1.3; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s2); margin: var(--s3) 0; }
.actions .btn { margin: 0; }
.linkbtn { font: inherit; font-size: 0.9375rem; min-height: 44px; padding: 0; border: 0; background: none; color: var(--accent); text-decoration: underline; cursor: pointer; }
.topbar { display: flex; align-items: center; gap: var(--s2); min-height: 44px; margin: 0 0 var(--s3); }
.topbar .brand { margin: 0; }
.spacer { flex: 1; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 1.375rem; }
.backbtn { font: inherit; display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--s2) 0 0; border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;

  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.tabbar a { flex: 1; max-width: 220px; display: flex; align-items: center; justify-content: center; min-height: 56px; color: var(--muted); text-decoration: none; font-weight: 600; }
.tabbar a[aria-current="page"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
body.has-nav #app { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
body.has-nav .toast { bottom: calc(72px + env(safe-area-inset-bottom)); }
.sub { color: var(--muted); margin: 0 0 var(--s3); }
h2.section { margin: var(--s5) 0 var(--s2); }
.count { color: var(--muted); font-weight: 400; }
.empty { text-align: center; padding: var(--s5) var(--s4); }
.multiline { white-space: pre-wrap; }
.overdue { color: var(--danger); font-weight: 600; }

/* ---- Goal cards and status ---- */
.goal-card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s3) var(--s4); margin: 0 0 var(--s3); color: var(--text); text-decoration: none; }
.goal-card.infocus { border-left: 4px solid var(--accent); }
.gc-top { display: flex; align-items: flex-start; gap: var(--s2); }
.gc-title { flex: 1; min-width: 0; font-weight: 600; font-size: 1.0625rem; line-height: 1.35; }
.gc-why { margin: var(--s1) 0 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.gc-row { display: flex; gap: var(--s2); margin-top: var(--s1); font-size: 0.9375rem; }
.gc-row .label { color: var(--muted); flex: 0 0 5.5rem; }
.gc-row .val { flex: 1; min-width: 0; }
.strip { display: flex; gap: 6px; margin-top: var(--s2); color: var(--muted); }
.strip .cell { width: 1.25rem; text-align: center; }
.strip .yes, .strip .some { color: var(--accent); }
.badge { display: inline-block; padding: 2px var(--s2); border-radius: 999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.badge.stall { color: var(--warn); background: var(--warn-bg); }
.chip { display: inline-block; padding: 2px var(--s3); border-radius: 999px; border: 1px solid currentColor; font-size: 0.875rem; font-weight: 600; margin: 0 0 var(--s2); }
.chip.active { color: var(--accent); }
.chip.parked { color: var(--warn); }
.chip.achieved { color: var(--good); }
.chip.dropped { color: var(--muted); }

/* ---- Forms ---- */
.field { margin: 0 0 var(--s4); }
fieldset.field { border: 0; padding: 0; min-width: 0; }
.field > label, .field > legend { display: block; font-weight: 600; margin: 0 0 var(--s1); padding: 0; }
.hint { font-size: 0.875rem; color: var(--muted); margin: var(--s1) 0 0; }
input[type="text"], input[type="date"], select {
  display: block; width: 100%; min-height: 44px; padding: var(--s2); font: inherit; font-size: 16px;
  color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
textarea.short { min-height: 5rem; }
.row2 { display: flex; gap: var(--s2); }
.row2 > * { flex: 1; min-width: 0; }
.check { display: flex; align-items: center; gap: var(--s2); min-height: 44px; }
.check input { width: 22px; height: 22px; margin: 0; flex-shrink: 0; }
.changebox { background: var(--info-bg); border: 1px solid var(--accent); border-radius: var(--radius); padding: var(--s3) var(--s4); margin: 0 0 var(--s4); }
.notice { background: var(--warn-bg); border-radius: var(--radius); padding: var(--s3) var(--s4); margin: 0 0 var(--s4); }
.inline-form { display: flex; gap: var(--s2); align-items: stretch; }
.inline-form input { flex: 1; min-width: 0; }
.inline-form .btn { margin: 0; }
input[type="file"] { font: inherit; font-size: 16px; max-width: 100%; }

/* ---- History, reorder, shelf ---- */
.timeline { list-style: none; padding: 0; margin: 0; }
.timeline > li { padding: var(--s3) 0; border-top: 1px solid var(--line); }
.timeline > li:first-child { border-top: 0; }
.tl-meta { font-size: 0.875rem; color: var(--muted); }
.tl-diffs { margin: var(--s1) 0 0; padding-left: 1.1rem; }
.tl-reason { margin: var(--s1) 0 0; white-space: pre-wrap; }
.tag { display: inline-block; font-size: 0.75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 var(--s2); margin-left: var(--s2); font-weight: 400; }
.reorder { list-style: none; padding: 0; margin: 0; }
.reorder > li { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) 0; border-top: 1px solid var(--line); }
.reorder > li:first-child { border-top: 0; }
.reorder .name { flex: 1; min-width: 0; }
.reorder .btn { margin: 0; }
.shelf-item { display: block; padding: var(--s3) 0; border-top: 1px solid var(--line); color: var(--text); text-decoration: none; }
.shelf-item:first-child { border-top: 0; }
.shelf-item .t { font-weight: 600; }
.shelf-item .m { font-size: 0.875rem; color: var(--muted); }
.shelf-item .r { font-size: 0.875rem; margin-top: var(--s1); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---- Check-in, insights ---- */
h3 { font-size: 1rem; margin: var(--s3) 0 var(--s1); }
.card.checkin { border-color: var(--accent); }
.card.empty .actions { justify-content: center; }
.answers { display: flex; gap: var(--s2); }
.answers .btn { flex: 1; margin: 0; }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.heat-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: var(--s3) 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.heat { border-collapse: separate; border-spacing: 0; }
.heat th, .heat td { padding: 0; text-align: center; vertical-align: middle; }
.heat thead th { font-size: 0.75rem; color: var(--muted); font-weight: 600; padding: var(--s2) var(--s1); white-space: nowrap; }
.heat .rowhead { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; min-width: 9rem; max-width: 12rem; padding: var(--s2) var(--s3); border-right: 1px solid var(--line); font-weight: 600; }
.heat tbody tr + tr > * { border-top: 1px solid var(--line); }
.cellbtn { width: 44px; height: 44px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 1.125rem; cursor: pointer; border-radius: 8px; }
.cellbtn.yes, .cellbtn.some { color: var(--accent); }
.cellbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.rowstat { font-size: 0.8125rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
.legend { font-size: 0.875rem; color: var(--muted); }

/* ---- Pop-up dialogs (never with text fields: rule 8) ---- */
body.dialog-open { overflow: hidden; }
.dialog-backdrop {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, 0.45); padding: var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
}
.dialog { width: 100%; max-width: 480px; max-height: 85vh; overflow: auto; background: var(--surface); color: var(--text); border-radius: var(--radius); padding: var(--s4); }
.dialog h2 { margin-top: 0; }
.dialog .actions { justify-content: flex-end; }
.dialog .choice { display: flex; width: 100%; justify-content: flex-start; text-align: left; margin: 0 0 var(--s2); }
@media (min-width: 600px) { .dialog-backdrop { align-items: center; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

/* =============================== MODEL =============================== */
function defaultDoc(now) {
  const iso = isoNow(now);
  return { app: APP_ID, schemaVersion: SCHEMA_VERSION, rev: 0, createdAt: iso, updatedAt: iso, settings: clone(DEFAULT_SETTINGS), goals: [], changes: [], checkins: [] };
}

// MIGRATIONS[n] turns a schema-n doc into schema n + 1. Schema 1 is the first, so none exist yet.
// Anything that is not an object, or has no whole-number schemaVersion, comes back unchanged for validate to reject.
const MIGRATIONS = {};
function migrate(obj) {
  if (!isObj(obj)) return obj;
  let doc = clone(obj);
  while (isInt(doc.schemaVersion) && doc.schemaVersion < SCHEMA_VERSION) {
    const step = MIGRATIONS[doc.schemaVersion];
    if (typeof step !== 'function') throw new Error('no upgrade path from schema ' + doc.schemaVersion);
    doc = step(doc);
  }
  return doc;
}

/* Selectors */
function goalById(doc, id) { return doc.goals.find(g => g.id === id) || null; }
function activeGoals(doc) { return doc.goals.filter(g => g.status === 'active'); }
function focusGoals(doc) { return doc.goals.filter(g => g.status === 'active' && g.inFocus); }
function currentMilestone(goal) { return goal.milestones.find(m => m.status === 'current') || null; }
function draftCheckin(doc) { return doc.checkins.find(c => c.completedAt === null) || null; }
function checkinByWeek(doc, weekKey) { return doc.checkins.find(c => c.weekKey === weekKey) || null; }
function completedNewestFirst(doc) {
  return doc.checkins.filter(c => c.completedAt !== null).sort((a, b) => (a.weekKey < b.weekKey ? 1 : a.weekKey > b.weekKey ? -1 : 0));
}
// True when no finished check-in is newer than weekKey. Check-ins dated after the current week
// (made while the device clock was wrong) are ignored, so they cannot block later updates.
function isLatestCompleted(doc, weekKey, now) {
  const cur = currentWeekKey(now, doc.settings.weekStartsOn);
  return !doc.checkins.some(c => c.completedAt !== null && c.weekKey > weekKey && c.weekKey <= cur);
}
// Answers from finished check-ins, newest week first, from weeks before beforeWeekKey (null: all weeks).
// Check-ins that do not include the goal are skipped.
function answersFor(doc, goalId, beforeWeekKey) {
  const out = [];
  completedNewestFirst(doc).forEach(c => {
    if (beforeWeekKey && c.weekKey >= beforeWeekKey) return;
    const it = c.items.find(i => i.goalId === goalId);
    if (it && it.progress) out.push({ weekKey: c.weekKey, progress: it.progress, note: it.note });
  });
  return out;
}
// Stalled when the most recent staleAfter answers are all "no". Future-dated check-ins are ignored.
function isStalled(doc, goalId, now) {
  const n = doc.settings.staleAfter;
  const nextWeek = addDays(currentWeekKey(now, doc.settings.weekStartsOn), 7);
  const recent = answersFor(doc, goalId, nextWeek).slice(0, n);
  return recent.length === n && recent.every(a => a.progress === 'no');
}
function shouldPromptStall(doc, goalId, weekKey, progress) {
  if (progress !== 'no') return false;
  const g = goalById(doc, goalId);
  if (!g) return false;
  if (g.staleSnoozeUntil && weekKey < g.staleSnoozeUntil) return false;
  const n = doc.settings.staleAfter;
  const earlier = answersFor(doc, goalId, weekKey).slice(0, n - 1);
  return earlier.length === n - 1 && earlier.every(a => a.progress === 'no');
}
function defaultCheckinWeek(doc, now) {
  const today = todayLocal(now);
  const cur = weekStart(today, doc.settings.weekStartsOn);
  const prev = addDays(cur, -7);
  const prevDone = doc.checkins.some(c => c.weekKey === prev && c.completedAt !== null);
  return (!prevDone && diffDays(cur, today) <= 2) ? prev : cur;
}
function nextStepGoalId(doc, checkin) {
  for (const g of activeGoals(doc)) {
    const it = checkin.items.find(i => i.goalId === g.id);
    if (!it || it.progress === null) return g.id;
  }
  return null; // null means the focus step comes next
}
function revisitsDue(doc, now) {
  const today = todayLocal(now);
  return doc.goals.filter(g => g.status === 'parked' && g.revisitOn !== null && g.revisitOn <= today);
}
// yes | some | no | excluded (check-in without this goal) | none (no check-in that week)
function cellState(doc, goalId, weekKey) {
  const c = doc.checkins.find(x => x.weekKey === weekKey && x.completedAt !== null);
  if (!c) return 'none';
  const it = c.items.find(i => i.goalId === goalId);
  return it ? it.progress : 'excluded';
}

/* Invariants (spec section 4). Returns a list of problems; empty means valid. */
function validate(doc) {
  const errs = [];
  const E = msg => { errs.push(msg); };
  if (!isObj(doc)) return ['The data is not an object.'];
  if (doc.app !== APP_ID) E('app must be "' + APP_ID + '".');
  if (doc.schemaVersion !== SCHEMA_VERSION) E('schemaVersion must be ' + SCHEMA_VERSION + '.');
  if (!isInt(doc.rev) || doc.rev < 0) E('rev must be a whole number.');
  if (!isISO(doc.createdAt) || !isISO(doc.updatedAt)) E('createdAt and updatedAt must be timestamps.');
  if (!isObj(doc.settings) || !Array.isArray(doc.goals) || !Array.isArray(doc.changes) || !Array.isArray(doc.checkins)) {
    E('settings, goals, changes or checkins is missing or the wrong type.');
    return errs;
  }
  const s = doc.settings;
  if (!isInt(s.weekStartsOn) || s.weekStartsOn < 0 || s.weekStartsOn > 6) E('settings.weekStartsOn must be 0 to 6.');
  if (!isInt(s.staleAfter) || s.staleAfter < 2 || s.staleAfter > 6) E('settings.staleAfter must be 2 to 6.');
  if (s.lastExportAt !== null && !isISO(s.lastExportAt)) E('settings.lastExportAt must be a timestamp or empty.');
  if (s.backupSnoozeUntil !== null && !isYMD(s.backupSnoozeUntil)) E('settings.backupSnoozeUntil must be a date or empty.');
  if (typeof s.installHintDismissed !== 'boolean') E('settings.installHintDismissed must be true or false.');

  const seen = new Set();
  const checkId = (id, where) => {
    if (!isStr(id) || id === '') { E(where + ' has no id.'); return; }
    if (seen.has(id)) E(where + ' repeats id ' + id + '.');
    seen.add(id);
  };

  const goalIds = new Set();
  let focusCount = 0;
  doc.goals.forEach((g, gi) => {
    const w = 'Goal ' + (gi + 1);
    if (!isObj(g)) { E(w + ' is not an object.'); return; }
    checkId(g.id, w);
    if (isStr(g.id)) goalIds.add(g.id);
    if (!isStr(g.title) || g.title.trim() === '') E(w + ' has no title.');
    if (!isStr(g.why) || !isStr(g.doneLooksLike) || !isStr(g.nextAction)) E(w + ': why, doneLooksLike and nextAction must be text.');
    if (g.targetMonth !== null && !isYM(g.targetMonth)) E(w + ': targetMonth must be YYYY-MM or empty.');
    if (!STATUSES.includes(g.status)) E(w + ': unknown status.');
    if (typeof g.inFocus !== 'boolean') E(w + ': inFocus must be true or false.');
    else if (g.inFocus && g.status !== 'active') E(w + ' is in focus but not active.');
    else if (g.inFocus) focusCount += 1;
    if (g.revisitOn !== null && !isYMD(g.revisitOn)) E(w + ': revisitOn must be a date or empty.');
    else if (g.revisitOn !== null && g.status !== 'parked') E(w + ' has a revisit date but is not parked.');
    if (g.staleSnoozeUntil !== null && !isYMD(g.staleSnoozeUntil)) E(w + ': staleSnoozeUntil must be a date or empty.');
    if (!isISO(g.createdAt) || !isISO(g.updatedAt)) E(w + ': createdAt and updatedAt must be timestamps.');
    if (g.closedAt !== null && !isISO(g.closedAt)) E(w + ': closedAt must be a timestamp or empty.');
    if (!Array.isArray(g.milestones)) { E(w + ': milestones must be a list.'); return; }
    let current = 0;
    g.milestones.forEach((m, mi) => {
      const mw = w + ', milestone ' + (mi + 1);
      if (!isObj(m)) { E(mw + ' is not an object.'); return; }
      checkId(m.id, mw);
      if (!isStr(m.text) || m.text.trim() === '') E(mw + ' has no text.');
      if (m.dueDate !== null && !isYMD(m.dueDate)) E(mw + ': dueDate must be a date or empty.');
      if (!MILESTONE_STATUSES.includes(m.status)) E(mw + ': unknown status.');
      if (m.status === 'current') current += 1;
      if (!isISO(m.createdAt)) E(mw + ': createdAt must be a timestamp.');
      if (m.closedAt !== null && !isISO(m.closedAt)) E(mw + ': closedAt must be a timestamp or empty.');
    });
    if (current > 1) E(w + ' has more than one current milestone.');
    if (current > 0 && (g.status === 'achieved' || g.status === 'dropped')) E(w + ' is closed but still has a current milestone.');
  });
  if (focusCount > MAX_FOCUS) E('More than ' + MAX_FOCUS + ' goals are in focus.');

  doc.changes.forEach((c, ci) => {
    const w = 'History entry ' + (ci + 1);
    if (!isObj(c)) { E(w + ' is not an object.'); return; }
    checkId(c.id, w);
    if (!goalIds.has(c.goalId)) E(w + ' points to a goal that does not exist.');
    if (!isISO(c.at)) E(w + ': at must be a timestamp.');
    if (!CHANGE_KINDS.includes(c.kind)) E(w + ': unknown kind.');
    if (!Array.isArray(c.diffs)) E(w + ': diffs must be a list.');
    else c.diffs.forEach(df => {
      const okDiff = isObj(df) && DIFF_FIELDS.includes(df.field) && ('from' in df) && ('to' in df)
        && (df.from === null || isStr(df.from)) && (df.to === null || isStr(df.to));
      if (!okDiff) E(w + ' has a malformed change.');
    });
    if (!isStr(c.reason)) E(w + ': reason must be text.');
    if (typeof c.minor !== 'boolean') E(w + ': minor must be true or false.');
  });

  const weeks = new Set();
  let drafts = 0;
  doc.checkins.forEach((c, ci) => {
    const w = 'Check-in ' + (ci + 1);
    if (!isObj(c)) { E(w + ' is not an object.'); return; }
    checkId(c.id, w);
    if (!isYMD(c.weekKey)) E(w + ': weekKey must be a date.');
    else {
      if (weeks.has(c.weekKey)) E(w + ' repeats the week of ' + c.weekKey + '.');
      weeks.add(c.weekKey);
      if (weekdayOf(c.weekKey) !== s.weekStartsOn) E(w + ' does not start on the chosen first day of the week.');
    }
    if (!isISO(c.startedAt)) E(w + ': startedAt must be a timestamp.');
    if (c.completedAt === null) drafts += 1;
    else if (!isISO(c.completedAt)) E(w + ': completedAt must be a timestamp or empty.');
    if (!Array.isArray(c.items)) E(w + ': items must be a list.');
    else {
      const inThis = new Set();
      c.items.forEach((it, ii) => {
        const iw = w + ', item ' + (ii + 1);
        if (!isObj(it)) { E(iw + ' is not an object.'); return; }
        if (!goalIds.has(it.goalId)) E(iw + ' points to a goal that does not exist.');
        if (inThis.has(it.goalId)) E(iw + ' repeats a goal.');
        inThis.add(it.goalId);
        if (it.progress !== null && !PROGRESS.includes(it.progress)) E(iw + ': unknown progress.');
        if (it.progress === null && c.completedAt !== null) E(iw + ' is unanswered in a finished check-in.');
        if (!isStr(it.note)) E(iw + ': note must be text.');
        if (it.nextAction !== null && !isStr(it.nextAction)) E(iw + ': nextAction must be text or empty.');
      });
    }
    if (!Array.isArray(c.focusGoalIds) || !c.focusGoalIds.every(x => isStr(x))) E(w + ': focusGoalIds must be a list of ids.');
    else if (!c.focusGoalIds.every(x => goalIds.has(x))) E(w + ' has a focus goal that does not exist.');
  });
  if (drafts > 1) E('There is more than one draft check-in.');
  return errs;
}

/* Safe repairs only (spec section 7, boot step 4). Anything else is left for the recovery screen.
   Never throws: data too damaged to repair comes back unchanged, so validation sends it to recovery. */
function repairDoc(doc, now) {
  try {
    if (!isObj(doc) || !Array.isArray(doc.goals) || !Array.isArray(doc.changes) || !Array.isArray(doc.checkins)) return doc;
    const sane = doc.goals.every(g => isObj(g) && Array.isArray(g.milestones) && g.milestones.every(m => isObj(m)))
      && doc.changes.every(c => isObj(c))
      && doc.checkins.every(c => isObj(c) && Array.isArray(c.items) && c.items.every(i => isObj(i)) && Array.isArray(c.focusGoalIds));
    if (!sane) return doc;
    const d = clone(doc);
    const iso = isoNow(now);
    const ids = new Set(d.goals.map(g => g.id));
    let inFocus = 0;
    d.goals.forEach(g => {
      if (g.inFocus && g.status !== 'active') g.inFocus = false;
      if (g.inFocus) { inFocus += 1; if (inFocus > MAX_FOCUS) g.inFocus = false; }
      if (g.revisitOn !== null && g.status !== 'parked') g.revisitOn = null;
      const current = g.milestones.filter(m => m.status === 'current');
      if (current.length > 1) {
        const keep = current.reduce((a, b) => (b.createdAt >= a.createdAt ? b : a));
        current.forEach(m => { if (m !== keep) { m.status = 'dropped'; m.closedAt = iso; } });
      }
    });
    d.changes = d.changes.filter(c => ids.has(c.goalId));
    d.checkins.forEach(c => {
      c.items = c.items.filter(i => ids.has(i.goalId));
      c.focusGoalIds = c.focusGoalIds.filter(id => ids.has(id));
    });
    return d;
  } catch (e) {
    return doc;
  }
}

/* Demo data: 6 goals, 10 finished weeks, built around "now". Pure apart from ids. */
function makeDemoDoc(now) {
  const d = defaultDoc(now);
  const today = todayLocal(now);
  const cur = weekStart(today, d.settings.weekStartsOn);
  const weeks = [];
  for (let i = 10; i >= 1; i -= 1) weeks.push(addDays(cur, -7 * i));
  const at = (day, hour) => new Date(mustYMD(day).t + hour * 3600000).toISOString();
  const start = addDays(weeks[0], -3);
  const month = monthOf(today);
  d.createdAt = at(start, 8);

  const mk = (title, why, done, monthsAhead, nextAction) => ({
    id: newId(), title, why, doneLooksLike: done, targetMonth: addMonthsYM(month, monthsAhead), nextAction,
    status: 'active', inFocus: false, revisitOn: null, staleSnoozeUntil: null, milestones: [],
    createdAt: at(start, 9), updatedAt: at(start, 9), closedAt: null,
  });
  const exams = mk('Pass final MBBS exams with distinction', 'Strong marks keep the specialty I want within reach.', 'Distinction in medicine and surgery on the final results.', 4, 'Timed mock paper on Sunday morning');
  const residency = mk('Get into an internal medicine residency', 'Medicine postings are the work I enjoy most.', 'An offer for an internal medicine seat I am happy with.', 14, 'Ask the unit head about a recommendation letter');
  const report = mk('Publish a case report', 'I want to learn how a paper gets written, and it helps applications.', 'A case report accepted by an indexed journal.', 6, 'Email the registrar about the consent form');
  const run = mk('Run a half marathon', 'Running keeps me steady through exam season.', 'Finish 21 km without walking.', 4, 'Long run of 12 km on Saturday');
  const spanish = mk('Learn conversational Spanish', 'For an elective abroad one day.', 'Hold a ten-minute conversation.', 10, '');
  const acls = mk('Complete BLS and ACLS certification', 'Required before internship starts.', 'Both certificates in hand.', 1, '');
  d.goals = [exams, residency, report, run, spanish, acls];

  const ms = (text, dueDate, created) => ({ id: newId(), text, dueDate, status: 'current', createdAt: created, closedAt: null });
  const change = (goal, when, kind, diffs, reason) => {
    d.changes.push({ id: newId(), goalId: goal.id, at: when, kind, diffs, reason: reason || '', minor: false });
  };

  d.goals.forEach(g => {
    const firstTarget = g === exams ? addMonthsYM(month, 3) : g.targetMonth;
    change(g, at(start, 9), 'created', [
      { field: 'title', from: null, to: g.title },
      { field: 'why', from: null, to: g.why },
      { field: 'doneLooksLike', from: null, to: g.doneLooksLike },
      { field: 'targetMonth', from: null, to: firstTarget },
    ], '');
  });

  const t0 = at(start, 10);
  const exams1 = ms('Finish the first pass of medicine', null, t0);
  const report1 = ms('Write up the case in full', null, t0);
  const acls1 = ms('Book and attend the ACLS course', null, t0);
  exams.milestones.push(exams1);
  report.milestones.push(report1);
  run.milestones.push(ms('Comfortable 15 km long run', addDays(today, 30), t0));
  spanish.milestones.push(ms('Finish a beginner course', null, t0));
  acls.milestones.push(acls1);
  [exams, report, run, spanish, acls].forEach(g => {
    const m = g.milestones[0];
    const diffs = [{ field: 'milestone', from: null, to: m.text }];
    if (m.dueDate) diffs.push({ field: 'milestoneDue', from: null, to: m.dueDate });
    change(g, t0, 'milestone-added', diffs, '');
  });

  const mid = i => at(addDays(weeks[i], 2), 12);
  change(exams, mid(1), 'edited', [{ field: 'targetMonth', from: addMonthsYM(month, 3), to: exams.targetMonth }], 'The exam dates were announced.');

  const resM = ms('Draft the personal statement', addDays(today, 21), mid(3));
  residency.milestones.push(resM);
  change(residency, mid(3), 'milestone-added', [{ field: 'milestone', from: null, to: resM.text }, { field: 'milestoneDue', from: null, to: resM.dueDate }], '');

  exams1.status = 'done';
  exams1.closedAt = mid(4);
  change(exams, mid(4), 'milestone-done', [{ field: 'milestone', from: exams1.text, to: null }], '');
  const exams2 = ms('First full revision of medicine and surgery', addDays(today, 42), mid(4));
  exams.milestones.push(exams2);
  change(exams, mid(4), 'milestone-added', [{ field: 'milestone', from: null, to: exams2.text }, { field: 'milestoneDue', from: null, to: exams2.dueDate }], '');

  spanish.status = 'parked';
  spanish.revisitOn = addDays(today, -1);
  spanish.updatedAt = mid(4);
  change(spanish, mid(4), 'status', [{ field: 'status', from: 'active', to: 'parked' }, { field: 'revisitOn', from: null, to: spanish.revisitOn }], 'Exams come first. Revisit after finals.');

  report1.status = 'dropped';
  report1.closedAt = mid(6);
  const report2 = ms('Get patient consent and find a co-author', null, mid(6));
  report.milestones.push(report2);
  change(report, mid(6), 'milestone-replaced', [{ field: 'milestone', from: report1.text, to: report2.text }], 'Cannot write it up before consent is in place.');

  acls.status = 'achieved';
  acls.closedAt = mid(6);
  acls.updatedAt = mid(6);
  acls1.status = 'done';
  acls1.closedAt = mid(6);
  change(acls, mid(6), 'status', [{ field: 'status', from: 'active', to: 'achieved' }], 'Both courses done.');

  const answers = new Map([
    [exams, ['yes', 'yes', 'some', 'yes', 'yes', 'some', 'yes', 'yes', 'some', 'yes']],
    [residency, ['some', 'no', 'some', 'yes', 'some', 'no', 'some', 'yes', 'yes', 'some']],
    [report, ['yes', 'some', 'some', 'no', 'some', 'yes', 'some', 'no', 'no', 'no']],
    [run, ['some', 'yes', 'no', 'some', 'yes', 'yes', 'no', 'some', 'yes', 'yes']],
    [spanish, ['no', 'some', 'no', 'no']],
    [acls, ['yes', 'yes', 'yes', 'some', 'yes', 'yes']],
  ]);
  const notes = new Map([
    ['9:' + exams.id, 'Two mock papers done, weak on nephrology.'],
    ['9:' + report.id, 'Registrar on leave, nothing moved.'],
    ['8:' + run.id, '14 km, felt good.'],
    ['3:' + spanish.id, 'No time with ward duties.'],
  ]);
  weeks.forEach((wk, i) => {
    const items = [];
    answers.forEach((list, g) => {
      if (i < list.length) items.push({ goalId: g.id, progress: list[i], note: notes.get(i + ':' + g.id) || '', nextAction: null });
    });
    d.checkins.push({ id: newId(), weekKey: wk, startedAt: at(addDays(wk, 6), 5), completedAt: at(addDays(wk, 6), 6), items, focusGoalIds: [exams.id, residency.id, report.id] });
  });

  [exams, residency, report].forEach(g => { g.inFocus = true; });
  d.updatedAt = at(addDays(weeks[9], 6), 6);
  return d;
}
  /* =============================== ACTIONS =============================== */
// Every change to the data goes through runAction (rule 5). Actions are pure: they change the copy they
// are given, read the time only from `now` (new ids are the one exception), and throw UserError for
// anything the user can fix. Creating actions take the new item's id from the form, so a repeated
// submit finds the item already there and does nothing.

function toInt(v) {
  if (isInt(v)) return v;
  if (isStr(v) && /^\d+$/.test(v)) return Number(v);
  return NaN;
}
function formId(v) { return isStr(v) && v !== '' ? v : newId(); }
function mustGoal(d, id) {
  const g = goalById(d, id);
  if (!g) fail('That goal no longer exists.');
  return g;
}
function optMonth(v) {
  if (v === null || v === undefined || v === '') return null;
  if (!isYM(v)) fail('Pick both a month and a year for the target, or neither.');
  return v;
}
function optDate(v, label) {
  if (v === null || v === undefined || v === '') return null;
  if (!isYMD(v)) fail(label + ' is not a valid date.');
  return v;
}
function reasonOf(p, required, what) {
  const r = cleanText(p.reason);
  if (required && r === '') fail('Add a reason for ' + what + '.');
  checkLen('The reason', r, LIMITS.reason, false);
  return r;
}
function goalFieldsFrom(p) {
  const f = { title: cleanLine(p.title), why: cleanText(p.why), doneLooksLike: cleanText(p.doneLooksLike), targetMonth: optMonth(p.targetMonth) };
  checkLen('The title', f.title, LIMITS.title, true);
  checkLen('"Why it matters"', f.why, LIMITS.why, false);
  checkLen('"Done looks like"', f.doneLooksLike, LIMITS.doneLooksLike, false);
  return f;
}
function activeLimitCheck(d) {
  if (activeGoals(d).length >= MAX_ACTIVE) fail('You already have ' + MAX_ACTIVE + ' active goals. Park or close one first.');
}
function logChange(d, goalId, kind, diffs, reason, minor, now) {
  d.changes.push({ id: newId(), goalId, at: isoNow(now), kind, diffs, reason, minor });
}
function moveToEnd(d, g) { d.goals = d.goals.filter(x => x !== g).concat([g]); }
function blankItem(goalId) { return { goalId, progress: null, note: '', nextAction: null }; }
// Adds a blank item for each active goal that lacks one, and removes unanswered items for goals
// that are no longer active. Answered items are always kept.
function reconcileItems(d, c) {
  const active = activeGoals(d);
  const ids = new Set(active.map(g => g.id));
  c.items = c.items.filter(it => it.progress !== null || ids.has(it.goalId));
  active.forEach(g => { if (!c.items.some(it => it.goalId === g.id)) c.items.push(blankItem(g.id)); });
}

const ACTIONS = {
  /* ---- Goals ---- */
  addGoal(d, p, now) {
    const id = formId(p.id);
    if (goalById(d, id)) return { goalId: id };            // repeated submit: already added
    const f = goalFieldsFrom(p);
    activeLimitCheck(d);
    const iso = isoNow(now);
    d.goals.push({
      id, title: f.title, why: f.why, doneLooksLike: f.doneLooksLike, targetMonth: f.targetMonth, nextAction: '',
      status: 'active', inFocus: false, revisitOn: null, staleSnoozeUntil: null, milestones: [],
      createdAt: iso, updatedAt: iso, closedAt: null,
    });
    const diffs = [{ field: 'title', from: null, to: f.title }];
    if (f.why) diffs.push({ field: 'why', from: null, to: f.why });
    if (f.doneLooksLike) diffs.push({ field: 'doneLooksLike', from: null, to: f.doneLooksLike });
    if (f.targetMonth) diffs.push({ field: 'targetMonth', from: null, to: f.targetMonth });
    logChange(d, id, 'created', diffs, reasonOf(p, false, ''), false, now);
    return { goalId: id };
  },

  editGoal(d, p, now) {
    const g = mustGoal(d, p.goalId);
    const f = goalFieldsFrom(p);
    const saved = { title: cleanLine(g.title), why: cleanText(g.why), doneLooksLike: cleanText(g.doneLooksLike), targetMonth: g.targetMonth };
    const diffs = EDITOR_FIELDS.filter(k => saved[k] !== f[k]).map(k => ({ field: k, from: g[k], to: f[k] }));
    if (!diffs.length) return {};                          // nothing changed: no history entry
    const reason = reasonOf(p, false, '');
    diffs.forEach(df => { g[df.field] = df.to; });
    g.updatedAt = isoNow(now);
    logChange(d, g.id, 'edited', diffs, reason, p.minor === true, now);
    return {};
  },

  setNextAction(d, p, now) {
    const g = mustGoal(d, p.goalId);
    const v = cleanLine(p.nextAction);
    checkLen('The next action', v, LIMITS.nextAction, false);
    if (g.nextAction === v) return {};
    g.nextAction = v;
    g.updatedAt = isoNow(now);
    return {};
  },

  moveGoal(d, p) {
    const g = mustGoal(d, p.goalId);
    if (g.status !== 'active') fail('Only active goals can be reordered.');
    const step = p.direction === 'up' ? -1 : p.direction === 'down' ? 1 : 0;
    if (step === 0) throw new Error('moveGoal needs direction "up" or "down".');
    const i = d.goals.indexOf(g);
    let j = i + step;
    while (j >= 0 && j < d.goals.length && d.goals[j].status !== 'active') j += step;
    if (j < 0 || j >= d.goals.length) return {};           // already first or last
    d.goals[i] = d.goals[j];
    d.goals[j] = g;
    return {};
  },

  setFocus(d, p) {
    const g = mustGoal(d, p.goalId);
    if (p.on !== true) { g.inFocus = false; return {}; }
    if (g.status !== 'active') fail('Only active goals can be in focus.');
    if (g.inFocus) return {};
    const focused = focusGoals(d);
    if (focused.length >= MAX_FOCUS) {
      const out = focused.find(x => x.id === p.replaceGoalId);
      if (!out) fail(MAX_FOCUS + ' goals are already in focus. Choose one to swap out.');
      out.inFocus = false;
    }
    g.inFocus = true;
    return {};
  },

  setStatus(d, p, now) {
    const g = mustGoal(d, p.goalId);
    const to = p.to;
    if (!STATUSES.includes(to)) throw new Error('Unknown status: ' + to);
    const from = g.status;
    if (from === to) return {};                            // repeated submit
    if (!TRANSITIONS[from].includes(to)) fail('A goal that is ' + from + ' cannot be marked ' + to + '.');
    const reason = reasonOf(p, to === 'parked' || to === 'dropped', to === 'parked' ? 'parking it' : 'dropping it');
    let revisitOn = null;
    if (to === 'parked') {
      revisitOn = optDate(p.revisitOn, 'The revisit date');
      if (revisitOn !== null && revisitOn <= todayLocal(now)) fail('Pick a revisit date after today, or leave it empty.');
    }
    if (to === 'active') activeLimitCheck(d);
    const iso = isoNow(now);
    const diffs = [{ field: 'status', from, to }];
    if (g.revisitOn !== revisitOn) diffs.push({ field: 'revisitOn', from: g.revisitOn, to: revisitOn });
    g.status = to;
    g.revisitOn = revisitOn;                               // leaving parked clears it
    if (to !== 'active') g.inFocus = false;
    const cm = currentMilestone(g);
    if (cm && (to === 'achieved' || to === 'dropped')) { cm.status = to === 'achieved' ? 'done' : 'dropped'; cm.closedAt = iso; }
    if (to === 'achieved' || to === 'dropped') g.closedAt = iso;
    if (to === 'active') { g.closedAt = null; moveToEnd(d, g); }
    g.updatedAt = iso;
    logChange(d, g.id, 'status', diffs, reason, false, now);
    return {};
  },

  // Changes only the revisit date of a parked goal. Logged as "edited" with a revisitOn change.
  keepParked(d, p, now) {
    const g = mustGoal(d, p.goalId);
    if (g.status !== 'parked') fail('This goal is no longer parked.');
    const revisitOn = optDate(p.revisitOn, 'The revisit date');
    if (revisitOn !== null && revisitOn <= todayLocal(now)) fail('Pick a revisit date after today, or leave it empty.');
    if (revisitOn === g.revisitOn) return {};
    logChange(d, g.id, 'edited', [{ field: 'revisitOn', from: g.revisitOn, to: revisitOn }], reasonOf(p, false, ''), false, now);
    g.revisitOn = revisitOn;
    g.updatedAt = isoNow(now);
    return {};
  },

  // "Keep going" on a stall prompt: no prompt again until staleAfter weeks after the week under review.
  snoozeStall(d, p) {
    const g = mustGoal(d, p.goalId);
    if (!isYMD(p.weekKey)) throw new Error('snoozeStall needs the week under review.');
    g.staleSnoozeUntil = addDays(p.weekKey, 7 * d.settings.staleAfter);
    return {};
  },

  deleteGoal(d, p) {
    const g = goalById(d, p.goalId);
    if (!g) return {};                                     // already deleted
    const id = g.id;
    d.goals = d.goals.filter(x => x.id !== id);
    d.changes = d.changes.filter(c => c.goalId !== id);
    d.checkins.forEach(c => {
      c.items = c.items.filter(it => it.goalId !== id);
      c.focusGoalIds = c.focusGoalIds.filter(x => x !== id);
    });
    return {};
  },

  /* ---- Milestones ---- */
  addMilestone(d, p, now) {
    const g = mustGoal(d, p.goalId);
    const id = formId(p.id);
    if (g.milestones.some(m => m.id === id)) return { milestoneId: id };   // repeated submit
    if (g.status === 'achieved' || g.status === 'dropped') fail('Reopen this goal before adding a milestone.');
    if (currentMilestone(g)) fail('This goal already has a current milestone. Mark it done or replace it.');
    const text = cleanLine(p.text);
    checkLen('The milestone', text, LIMITS.milestone, true);
    const dueDate = optDate(p.dueDate, 'The due date');
    const iso = isoNow(now);
    g.milestones.push({ id, text, dueDate, status: 'current', createdAt: iso, closedAt: null });
    const diffs = [{ field: 'milestone', from: null, to: text }];
    if (dueDate !== null) diffs.push({ field: 'milestoneDue', from: null, to: dueDate });
    g.updatedAt = iso;
    logChange(d, g.id, 'milestone-added', diffs, reasonOf(p, false, ''), false, now);
    return { milestoneId: id };
  },

  completeMilestone(d, p, now) {
    const g = mustGoal(d, p.goalId);
    const m = g.milestones.find(x => x.id === p.milestoneId);
    if (!m) fail('That milestone no longer exists.');
    if (m.status === 'done') return {};                    // repeated submit
    if (m.status !== 'current') fail('That milestone is no longer current.');
    const iso = isoNow(now);
    m.status = 'done';
    m.closedAt = iso;
    g.updatedAt = iso;
    logChange(d, g.id, 'milestone-done', [{ field: 'milestone', from: m.text, to: null }], reasonOf(p, false, ''), false, now);
    return {};
  },

  editMilestone(d, p, now) {
    const g = mustGoal(d, p.goalId);
    const m = g.milestones.find(x => x.id === p.milestoneId);
    if (!m || m.status !== 'current') fail('That milestone is no longer current.');
    const text = cleanLine(p.text);
    checkLen('The milestone', text, LIMITS.milestone, true);
    const dueDate = optDate(p.dueDate, 'The due date');
    const diffs = [];
    if (cleanLine(m.text) !== text) diffs.push({ field: 'milestone', from: m.text, to: text });
    if (m.dueDate !== dueDate) diffs.push({ field: 'milestoneDue', from: m.dueDate, to: dueDate });
    if (!diffs.length) return {};
    const reason = reasonOf(p, false, '');
    m.text = text;
    m.dueDate = dueDate;
    g.updatedAt = isoNow(now);
    logChange(d, g.id, 'milestone-edited', diffs, reason, p.minor === true, now);
    return {};
  },

  // The old milestone is kept as dropped; the new one becomes current. One history entry.
  replaceMilestone(d, p, now) {
    const g = mustGoal(d, p.goalId);
    const id = formId(p.replacementId);
    if (g.milestones.some(m => m.id === id)) return { milestoneId: id };   // repeated submit
    const old = g.milestones.find(x => x.id === p.milestoneId);
    if (!old || old.status !== 'current') fail('That milestone is no longer current.');
    const text = cleanLine(p.text);
    checkLen('The new milestone', text, LIMITS.milestone, true);
    const dueDate = optDate(p.dueDate, 'The due date');
    const reason = reasonOf(p, false, '');
    const iso = isoNow(now);
    old.status = 'dropped';
    old.closedAt = iso;
    g.milestones.push({ id, text, dueDate, status: 'current', createdAt: iso, closedAt: null });
    const diffs = [{ field: 'milestone', from: old.text, to: text }];
    if (old.dueDate !== dueDate) diffs.push({ field: 'milestoneDue', from: old.dueDate, to: dueDate });
    g.updatedAt = iso;
    logChange(d, g.id, 'milestone-replaced', diffs, reason, false, now);
    return { milestoneId: id };
  },

  /* ---- Check-ins (always addressed by their week) ---- */
  startCheckin(d, p, now) {
    const weekKey = p.weekKey;
    if (!isYMD(weekKey)) throw new Error('startCheckin needs a week.');
    const draft = draftCheckin(d);
    if (draft && draft.weekKey === weekKey) return { weekKey };          // already started: resume it
    if (draft) fail('Finish or discard the check-in for the week of ' + fmtYMD(draft.weekKey) + ' first.');
    const cur = currentWeekKey(now, d.settings.weekStartsOn);
    if (weekKey !== cur && weekKey !== addDays(cur, -7)) fail('You can check in for this week or last week only.');
    if (checkinByWeek(d, weekKey)) fail('That week already has a check-in. You can edit it instead.');
    const goals = activeGoals(d);
    if (!goals.length) fail('Add or reactivate a goal before checking in.');
    d.checkins.push({ id: newId(), weekKey, startedAt: isoNow(now), completedAt: null, items: goals.map(g => blankItem(g.id)), focusGoalIds: [] });
    return { weekKey };
  },

  // Saves an answer, note or next action as it is given. Omitted fields stay as they are;
  // nextAction null means "not edited", so Finish leaves the goal's own next action alone.
  answerItem(d, p) {
    const c = checkinByWeek(d, p.weekKey);
    if (!c) fail('This check-in no longer exists.');
    if (c.completedAt !== null) return {};                 // late save after Finish: the check-in is final
    let it = c.items.find(x => x.goalId === p.goalId);
    if (!it) {
      const g = mustGoal(d, p.goalId);
      if (g.status !== 'active') fail('This goal is no longer active.');
      it = blankItem(g.id);
      c.items.push(it);
    }
    if (p.progress !== undefined) {
      if (!PROGRESS.includes(p.progress)) throw new Error('Unknown answer: ' + p.progress);
      it.progress = p.progress;
    }
    if (p.note !== undefined) {
      const note = cleanText(p.note);
      checkLen('The note', note, LIMITS.note, false);
      it.note = note;
    }
    if (p.nextAction !== undefined) {
      if (p.nextAction === null) it.nextAction = null;
      else {
        const na = cleanLine(p.nextAction);
        checkLen('The next action', na, LIMITS.nextAction, false);
        it.nextAction = na;
      }
    }
    return {};
  },

  reconcileDraft(d, p) {
    const c = checkinByWeek(d, p.weekKey);
    if (!c || c.completedAt !== null) return {};
    reconcileItems(d, c);
    return {};
  },

  discardDraft(d, p) {
    const c = checkinByWeek(d, p.weekKey);
    if (!c || c.completedAt !== null) return {};           // already gone or finished
    d.checkins = d.checkins.filter(x => x !== c);
    return {};
  },

  finishCheckin(d, p, now) {
    const c = checkinByWeek(d, p.weekKey);
    if (!c) fail('This check-in no longer exists.');
    if (c.completedAt !== null) return { alreadyDone: true };          // repeated tap on Finish
    reconcileItems(d, c);
    if (!c.items.length) fail('There are no goals in this check-in. Discard it instead.');
    if (c.items.some(it => it.progress === null)) fail('Answer every goal before finishing.');
    const picked = [];
    (Array.isArray(p.focusGoalIds) ? p.focusGoalIds : []).forEach(id => { if (!picked.includes(id)) picked.push(id); });
    if (picked.length > MAX_FOCUS) fail('Pick up to ' + MAX_FOCUS + ' goals to focus on.');
    picked.forEach(id => {
      const g = goalById(d, id);
      if (!g || g.status !== 'active') fail('One of the goals you picked is no longer active. Pick again.');
    });
    const iso = isoNow(now);
    c.completedAt = iso;
    c.focusGoalIds = picked;
    if (isLatestCompleted(d, c.weekKey, now)) {
      c.items.forEach(it => {
        const g = goalById(d, it.goalId);
        if (it.nextAction !== null && g && g.nextAction !== it.nextAction) { g.nextAction = it.nextAction; g.updatedAt = iso; }
      });
      d.goals.forEach(g => { g.inFocus = g.status === 'active' && picked.includes(g.id); });
    }
    return { alreadyDone: false };
  },

  // Edits answers and notes of a finished check-in from this week or last week. No side effects.
  editCheckin(d, p, now) {
    const c = checkinByWeek(d, p.weekKey);
    if (!c || c.completedAt === null) fail('Only a finished check-in can be edited.');
    const cur = currentWeekKey(now, d.settings.weekStartsOn);
    if (c.weekKey !== cur && c.weekKey !== addDays(cur, -7)) fail('Only this week\'s and last week\'s check-ins can be edited.');
    (Array.isArray(p.items) ? p.items : []).forEach(e => {
      const it = isObj(e) ? c.items.find(x => x.goalId === e.goalId) : null;
      if (!it) return;                                     // goal deleted since
      if (e.progress !== undefined) {
        if (!PROGRESS.includes(e.progress)) throw new Error('Unknown answer: ' + e.progress);
        it.progress = e.progress;
      }
      if (e.note !== undefined) {
        const note = cleanText(e.note);
        checkLen('The note', note, LIMITS.note, false);
        it.note = note;
      }
    });
    return {};
  },

  /* ---- Settings ---- */
  updateSettings(d, p) {
    if (p.staleAfter !== undefined) {
      const n = toInt(p.staleAfter);
      if (!(n >= 2 && n <= 6)) fail('Choose between 2 and 6 check-ins.');
      d.settings.staleAfter = n;
    }
    if (p.weekStartsOn !== undefined) {
      const w = toInt(p.weekStartsOn);
      if (!(w >= 0 && w <= 6)) throw new Error('Unknown weekday: ' + p.weekStartsOn);
      if (w !== d.settings.weekStartsOn && d.checkins.length) fail('The first day of the week is locked once you have a check-in.');
      d.settings.weekStartsOn = w;
    }
    return {};
  },
  markExported(d, p, now) { d.settings.lastExportAt = isoNow(now); return {}; },
  snoozeBackupReminder(d, p, now) { d.settings.backupSnoozeUntil = addDays(todayLocal(now), 7); return {}; },
  dismissInstallHint(d) { d.settings.installHintDismissed = true; return {}; },
};

/* The pure half of commit (rule 5): copy the data, apply one action, check every invariant.
   If the action changed nothing, the original comes back with changed: false and nothing is saved. */
function runAction(doc, name, payload, now) {
  if (!Object.prototype.hasOwnProperty.call(ACTIONS, name)) throw new Error('Unknown action: ' + name);
  const before = JSON.stringify(doc);
  const d = JSON.parse(before);
  const result = ACTIONS[name](d, isObj(payload) ? payload : {}, now) || {};
  if (JSON.stringify(d) === before) return { doc, changed: false, result };
  d.updatedAt = isoNow(now);
  const errs = validate(d);
  if (errs.length) throw new Error('Internal check failed, so nothing was saved. ' + errs.join(' '));
  return { doc: d, changed: true, result };
}
  /* =============================== STORAGE =============================== */
// The only section that touches localStorage (rule 6). Reads and writes go through a "backend" with
// get, set, remove and keys, so memory mode, demo mode and the self-test run the same code on a plain map.

function memoryBackend(limitChars) {
  const m = new Map();
  return {
    kind: 'memory',
    get(k) { return m.has(k) ? m.get(k) : null; },
    set(k, v) {
      const text = String(v);
      if (limitChars) {
        let used = 0;
        m.forEach((val, key) => { if (key !== k) used += key.length + val.length; });
        if (used + k.length + text.length > limitChars) {
          const e = new Error('The storage space is full.');
          e.name = 'QuotaExceededError';
          throw e;
        }
      }
      m.set(k, text);
    },
    remove(k) { m.delete(k); },
    keys() { return Array.from(m.keys()); },
  };
}
function localBackend(ls) {
  return {
    kind: 'local',
    get(k) { return ls.getItem(k); },
    set(k, v) { ls.setItem(k, v); },
    remove(k) { ls.removeItem(k); },
    keys() {
      const out = [];
      for (let i = 0; i < ls.length; i += 1) { const k = ls.key(i); if (k !== null) out.push(k); }
      return out;
    },
  };
}
// Boot step 1. The first reference to localStorage sits inside try, because some browsers throw on access.
function probeLocalStorage() {
  try {
    const ls = window.localStorage;
    ls.setItem(KEYS.probe, '1');
    ls.removeItem(KEYS.probe);
    return { ok: true, backend: localBackend(ls) };
  } catch (e) {
    return { ok: false, reason: (e && e.name) || 'Error' };
  }
}
// What a stored text says about the save counter: absent, unreadable (rev null), or a rev.
function revOfText(raw) {
  if (!isStr(raw)) return { exists: false, rev: null };
  try {
    const o = JSON.parse(raw);
    return { exists: true, rev: isObj(o) && isInt(o.rev) ? o.rev : null };
  } catch (e) {
    return { exists: true, rev: null };
  }
}
// Boot steps 2-4 as a pure function of the stored text (spec 7). Writes nothing.
function interpretStored(raw, now) {
  if (!isStr(raw)) return { status: 'empty' };
  let obj;
  try { obj = JSON.parse(raw); } catch (e) { return { status: 'unreadable', problems: ['The saved data is not valid JSON.'] }; }
  if (!isObj(obj) || obj.app !== APP_ID) return { status: 'unreadable', problems: ['The saved data does not look like Compass data.'] };
  if (isInt(obj.schemaVersion) && obj.schemaVersion > SCHEMA_VERSION) {
    return { status: 'newer', problems: ['It uses data format ' + obj.schemaVersion + '; this version reads format ' + SCHEMA_VERSION + '.'] };
  }
  let doc;
  try { doc = migrate(obj); } catch (e) { return { status: 'unreadable', problems: ['The saved data could not be upgraded: ' + e.message] }; }
  const migrated = doc.schemaVersion !== obj.schemaVersion;
  const problems = validate(doc);
  if (!problems.length) return { status: 'ok', doc, migrated, repaired: false, problems: [] };
  const fixed = repairDoc(doc, now);
  const left = validate(fixed);
  if (!left.length) return { status: 'ok', doc: fixed, migrated, repaired: true, problems };
  return { status: 'unreadable', problems: left };
}

// One store per data source. The app uses one; the self-test builds its own on memory backends.
function makeStore(backend, mode) {
  const st = { backend, mode, memoryReason: '', loadedRev: null, locked: false };
  const safe = fn => { try { return fn(); } catch (e) { return undefined; } };

  // Never throws: a failed read looks like "no data", which a save then treats as a mismatch.
  st.readRaw = () => { const v = safe(() => st.backend.get(KEYS.data)); return isStr(v) ? v : null; };
  st.inSync = () => {
    const s = revOfText(st.readRaw());
    return st.loadedRev === null ? !s.exists : (s.exists && s.rev === st.loadedRev);
  };
  st.toMemory = (reason, dataText) => {
    const mem = memoryBackend(0);
    if (isStr(dataText)) mem.set(KEYS.data, dataText);
    st.backend = mem;
    st.mode = 'memory';
    st.memoryReason = reason;
  };

  /* Safety copies: up to SAFETY_MAX raw copies, newest last. Best effort (v1.1 fix 8). */
  st.safetyCopies = () => {
    const raw = safe(() => st.backend.get(KEYS.safety));
    const arr = isStr(raw) ? safe(() => JSON.parse(raw)) : null;
    return Array.isArray(arr) ? arr.filter(x => isObj(x) && isStr(x.raw) && isISO(x.at)) : [];
  };
  st.trimSafety = keep => {
    const list = keep > 0 ? st.safetyCopies().slice(-keep) : [];
    const done = safe(() => {
      if (list.length) st.backend.set(KEYS.safety, JSON.stringify(list));
      else st.backend.remove(KEYS.safety);
      return true;
    });
    if (!done) safe(() => st.backend.remove(KEYS.safety));
  };
  st.takeSafetyCopy = (raw, reason, now) => {
    if (!isStr(raw)) return false;
    let list = st.safetyCopies().concat([{ at: isoNow(now), reason: reason || '', raw }]).slice(-SAFETY_MAX);
    while (list.length) {
      const text = JSON.stringify(list);
      if (safe(() => { st.backend.set(KEYS.safety, text); return true; })) return true;
      list = list.slice(1);                                // drop the oldest and try again
    }
    safe(() => st.backend.remove(KEYS.safety));
    return false;
  };

  // Main save. Refuses on any mismatch with the stored save counter (another tab saved, or the data
  // is gone), then writes rev + 1. If the write fails, safety copies are cleared and it tries again;
  // if it still fails, the app carries on in memory mode with this data, so it can still be exported.
  st.save = doc => {
    if (st.locked) return { ok: false, reason: 'locked' };
    if (!st.inSync()) return { ok: false, reason: 'conflict' };
    const next = Object.assign({}, doc, { rev: Math.max(isInt(doc.rev) ? doc.rev : 0, st.loadedRev || 0) + 1 });
    const text = JSON.stringify(next);
    let err = null;
    try { st.backend.set(KEYS.data, text); } catch (e1) {
      st.trimSafety(0);
      try { st.backend.set(KEYS.data, text); } catch (e2) { err = e2; }
    }
    if (err) st.toMemory('the last save failed (' + (err.name || 'error') + '), most likely because storage is full or blocked.', text);
    st.loadedRev = next.rev;
    return { ok: true, doc: next };
  };

  // Replaces all data (import, restore, start fresh). Whatever is stored is copied first, the new data
  // gets a save counter above both, and if the write fails the stored data stays exactly as it was.
  st.replaceAll = (doc, now, reason) => {
    const raw = st.readRaw();
    if (!st.locked && !st.inSync()) return { ok: false, reason: 'conflict' };
    const copied = raw === null ? true : st.takeSafetyCopy(raw, reason, now);
    const next = Object.assign({}, doc, { rev: Math.max(isInt(doc.rev) ? doc.rev : 0, st.loadedRev || 0, revOfText(raw).rev || 0) + 1 });
    const text = JSON.stringify(next);
    try { st.backend.set(KEYS.data, text); } catch (e1) {
      st.trimSafety(1);
      try { st.backend.set(KEYS.data, text); } catch (e2) { return { ok: false, reason: 'full' }; }
    }
    st.loadedRev = next.rev;
    st.locked = false;
    st.removeAllDrafts();
    return { ok: true, doc: next, safetyCopied: copied };
  };

  st.eraseAll = () => {
    const keys = safe(() => st.backend.keys()) || [];
    let failed = 0;
    keys.filter(k => k.indexOf(KEY_PREFIX) === 0).forEach(k => { if (!safe(() => { st.backend.remove(k); return true; })) failed += 1; });
    st.loadedRev = null;
    st.locked = false;
    return failed === 0;
  };

  /* Editor drafts (spec 7). Best effort: a failed draft write never stops the app. */
  st.draftKey = goalId => KEYS.draftPrefix + (goalId || 'new');
  st.draftKeys = () => (safe(() => st.backend.keys()) || []).filter(k => k.indexOf(KEYS.draftPrefix) === 0);
  st.getDraft = goalId => {
    const o = safe(() => JSON.parse(st.backend.get(st.draftKey(goalId))));
    return isObj(o) && isISO(o.savedAt) && isObj(o.fields) ? o : null;
  };
  st.setDraft = (goalId, fields, now) => !!safe(() => { st.backend.set(st.draftKey(goalId), JSON.stringify({ savedAt: isoNow(now), fields })); return true; });
  st.removeDraft = goalId => { safe(() => st.backend.remove(st.draftKey(goalId))); };
  st.removeAllDrafts = () => { st.draftKeys().forEach(k => { safe(() => st.backend.remove(k)); }); };
  // Start-up cleanup: drafts older than DRAFT_MAX_DAYS, unreadable ones, and ones for goals that are gone.
  st.cleanupDrafts = (doc, now) => {
    const cutoff = now.getTime() - DRAFT_MAX_DAYS * DAY_MS;
    st.draftKeys().forEach(k => {
      const goalId = k.slice(KEYS.draftPrefix.length);
      const o = safe(() => JSON.parse(st.backend.get(k)));
      const stale = !isObj(o) || !isISO(o.savedAt) || Date.parse(o.savedAt) < cutoff;
      const gone = goalId !== 'new' && !(doc && goalById(doc, goalId));
      if (stale || gone) safe(() => st.backend.remove(k));
    });
  };

  st.usage = () => {
    const len = k => { const v = safe(() => st.backend.get(k)); return isStr(v) ? v.length : 0; };
    return { dataChars: len(KEYS.data), safetyChars: len(KEYS.safety), safetyCount: st.safetyCopies().length, draftCount: st.draftKeys().length };
  };

  return st;
}

/* Backups (spec 7). Pure: these only build and check text. */
function backupFileName(now) { return 'compass-backup-' + todayLocal(now) + '.json'; }

}
// Checks a backup before anything changes: size, JSON, app, version, upgrade, then every rule. No repairs.
function parseBackupText(text) {
  if (!isStr(text) || text.trim() === '') fail('That backup is empty.');
  if (utf8Bytes(text) > IMPORT_MAX_BYTES) fail('That file is too large to be a Compass backup.');
  let obj = null;
  try { obj = JSON.parse(text); } catch (e) { fail('That is not a Compass backup: it is not valid JSON.'); }
  if (!isObj(obj) || obj.app !== APP_ID) fail('That is not a Compass backup.');
  if (isInt(obj.schemaVersion) && obj.schemaVersion > SCHEMA_VERSION) fail('This backup comes from a newer version of Compass. Update the app, then import it.');
  const bare = Object.assign({}, obj);
  delete bare.exportedAt;
  delete bare.appVersion;
  let doc = null;
  try { doc = migrate(bare); } catch (e) { fail('This backup could not be upgraded to this version of Compass.'); }
  const problems = validate(doc);
  if (problems.length) {
    fail('This backup has problems, so nothing was imported. ' + problems.slice(0, 3).join(' ') + (problems.length > 3 ? ' (' + (problems.length - 3) + ' more)' : ''));
  }
  return doc;
}
function docSummary(doc) {
  const count = s => doc.goals.filter(g => g.status === s).length;
  return {
    goals: doc.goals.length, active: count('active'), parked: count('parked'), achieved: count('achieved'), dropped: count('dropped'),
    checkins: doc.checkins.filter(c => c.completedAt !== null).length,
    drafts: doc.checkins.filter(c => c.completedAt === null).length,

}

// Screens are built with el(); text always goes in as text nodes, never as HTML (rule 7). Each screen draws
// from a context (data, store, time) passed in, so the self-test can draw every screen with demo data.
const APP = {
  doc: null,              // the data this page works on (null while saved data is unreadable)
  store: null,            // from makeStore()
  boot: null,             // what loading found: { status, problems, migrated, repaired }
  demo: false,
  conflict: false,        // stored data changed elsewhere: saving pauses until reload
  repairSeen: false,
  persist: 'unknown',     // granted | not granted | unsupported | unknown
  persistAsked: false,
  depth: 0,               // in-app history entries behind this one, for goBack()
  depthKnown: false,
  routeName: '',          // the screen on display
  scroll: {},             // remembered scroll positions (the board)
  naDraft: {},            // next actions typed but not saved yet, by goal id
  showMinor: false,       // history shows minor edits
  insightsShelved: false, // insights include goals on the shelf
  pendingFocus: null,     // element ids to focus after the next draw; the first one available wins

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(k => {
      const v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k.slice(0, 2) === 'on') { if (typeof v === 'function') node.addEventListener(k.slice(2), v); return; }
      if (k === 'class') node.className = v;
      else node.setAttribute(k, v === true ? '' : String(v));
    });
  }
  const list = Array.isArray(children) ? children : (children === null || children === undefined ? [] : [children]);
  list.forEach(c => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return node;
}

let toastTimer = 0;
function ensureToast() {

  return t;
}
function toast(msg) {

}

}

// Download via a temporary link; the object URL is revoked after 10 seconds, not at once (spec 7).
function downloadText(filename, text, type) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
    const a = el('a', { href: url, download: filename, style: 'display:none' });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 10000);

    showError(e);

// Copies text; if the clipboard is unavailable, shows it selected in a read-only box to copy by hand.
function copyText(text, host) {
  const showBox = () => {
    const box = el('textarea', { readonly: true, 'aria-label': 'Text to copy' });
    box.value = text;
    host.textContent = '';
    host.appendChild(el('p', { class: 'small' }, 'Copying did not work here, so the text is selected below. Copy it by hand.'));
    host.appendChild(box);
    box.focus();
    box.select();

  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      navigator.clipboard.writeText(text).then(() => toast('Copied.'), showBox);
      return;
    }
  } catch (e) { /* fall back to the box */ }
  showBox();
}

// Requested once per session after a save, and only reported in Diagnostics, never relied on.
function requestPersistence() {
  if (APP.persistAsked) return;
  APP.persistAsked = true;
  try {
    const sm = navigator.storage;
    if (!sm || typeof sm.persist !== 'function' || typeof sm.persisted !== 'function') { APP.persist = 'unsupported'; return; }
    sm.persisted().then(already => (already ? true : sm.persist())).then(ok => { APP.persist = ok ? 'granted' : 'not granted'; }).catch(() => { APP.persist = 'unknown'; });
  } catch (e) {
    APP.persist = 'unknown';
  }
}
function checkPersistence() {
  try {
    const sm = navigator.storage;
    if (!sm || typeof sm.persisted !== 'function') { APP.persist = 'unsupported'; return; }
    sm.persisted().then(ok => {
      APP.persist = ok ? 'granted' : 'not granted';
      if (currentRoute().name === 'diagnostics') render();
    }).catch(() => { /* leave as unknown */ });
  } catch (e) { /* leave as unknown */ }
}

// Rule 5: the one way to change data. quiet: true saves without redrawing the page, for typing
// screens such as check-in steps (v1.1 fix 5). Returns the action's result, or null if nothing was saved.
function commit(name, payload, opts) {
  const quiet = !!(opts && opts.quiet);
  if (!APP.doc || !APP.store || APP.store.locked) { toast('Saving is paused because the saved data could not be read. See the recovery screen.'); return null; }
  if (APP.conflict) { toast('Your data changed in another tab or window. Reload before making changes.'); return null; }
  let out;
  try { out = runAction(APP.doc, name, payload, new Date()); } catch (e) { showError(e); return null; }
  if (!out.changed) return out.result;
  const saved = APP.store.save(out.doc);
  if (!saved.ok) {
    if (saved.reason === 'conflict') APP.conflict = true;
    renderBanners();
    toast(saved.reason === 'conflict' ? 'Your data changed in another tab or window, so this was not saved. Reload to see the latest.' : 'This could not be saved.');
    return null;
  }
  APP.doc = saved.doc;
  if (APP.store.mode === 'local') requestPersistence();
  if (quiet) renderBanners(); else render();
  return out.result;
}

// Boot steps 2-4 applied to the app (spec 7). Upgrades and repairs happen only after a safety copy,
// and data that cannot be read, or that a newer version saved, is locked against writes.
function loadData(now) {
  const st = APP.store;
  const raw = st.readRaw();
  const r = interpretStored(raw, now);
  APP.conflict = false;
  APP.boot = { status: r.status, problems: r.problems || [], migrated: !!r.migrated, repaired: !!r.repaired };
  if (r.status === 'empty') { st.locked = false; st.loadedRev = null; APP.doc = defaultDoc(now); return; }
  if (r.status !== 'ok') { st.locked = true; st.loadedRev = revOfText(raw).rev; APP.doc = null; return; }
  st.locked = false;
  st.loadedRev = revOfText(raw).rev;
  APP.doc = r.doc;
  if (r.migrated || r.repaired) {
    st.takeSafetyCopy(raw, r.migrated ? 'before upgrading the data format' : 'before repairing saved data', now);
    const saved = st.save(r.doc);
    if (saved.ok) APP.doc = saved.doc;
    else if (saved.reason === 'conflict') APP.conflict = true;
  }
}

// Another tab saved, or this page became visible again (spec 7; v1.1 fix 4). Pages with text fields are
// never redrawn: if the data changed underneath one, saving pauses and a Reload banner appears instead.
function syncFromStorage() {
  if (!APP.store || APP.store.mode !== 'local') return;   // demo and memory mode have no other writers
  if (APP.store.inSync()) { if (!isFormRoute()) render(); return; }
  if (isFormRoute()) { APP.conflict = true; renderBanners(); return; }
  loadData(new Date());
  render();
}

// Saves anything still waiting on a typing timer. Runs before every change of screen and whenever the
// app goes into the background (v1.1 fix 5).
function flushPending() {
  const f = APP.flush;
  APP.flush = null;
  if (typeof f === 'function') { try { f(); } catch (e) { showError(e); } }
}

/* Pop-up dialogs (rule 8): buttons only, never text fields. One at a time; closed by Cancel, Escape,
   a tap outside, or a change of page. */
let dialogState = null;
function openDialog(opts) {
  closeDialog();
  const returnFocus = document.activeElement;
  const buttons = (opts.buttons || [{ label: 'Close' }]).map(b => el('button', {
    class: 'btn' + (b.kind ? ' ' + b.kind : ''), type: 'button',
    onclick: () => { closeDialog(); if (b.run) b.run(); },
  }, b.label));
  const box = el('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dialog-title' }, [
    el('h2', { id: 'dialog-title' }, opts.title),
    opts.text ? el('p', null, opts.text) : null,
  ].concat(opts.nodes || [], [el('div', { class: 'actions' }, buttons)]));
  const backdrop = el('div', { class: 'dialog-backdrop', onclick: e => { if (e.target === backdrop) closeDialog(); } }, box);
  const onKey = e => {
    if (e.key === 'Escape') { e.preventDefault(); closeDialog(); return; }
    if (e.key !== 'Tab') return;
    const items = Array.from(box.querySelectorAll('button:not([disabled]), a[href]'));
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  document.addEventListener('keydown', onKey);
  document.body.appendChild(backdrop);
  document.body.classList.add('dialog-open');

  if (firstButton) firstButton.focus();
}

  document.removeEventListener('keydown', s.onKey);
  s.backdrop.remove();
  document.body.classList.remove('dialog-open');
  if (s.returnFocus && document.body.contains(s.returnFocus) && typeof s.returnFocus.focus === 'function') {
    try { s.returnFocus.focus({ preventScroll: true }); } catch (e) { /* nothing to return to */ }
  }
}

/* Labels and formatting */
const STATUS_LABEL = { active: 'Active', parked: 'Parked', achieved: 'Achieved', dropped: 'Dropped' };
const PROGRESS_LABEL = { yes: 'Yes', some: 'A bit', no: 'No' };
const KIND_LABEL = {
  created: 'Created', edited: 'Edited', status: 'Status changed', 'milestone-added': 'Milestone added',
  'milestone-done': 'Milestone done', 'milestone-edited': 'Milestone edited', 'milestone-replaced': 'Milestone replaced',
};
const FIELD_LABELS = {
  title: 'Title', why: 'Why it matters', doneLooksLike: 'Done looks like', targetMonth: 'Target', status: 'Status',
  revisitOn: 'Revisit date', milestone: 'Milestone', milestoneDue: 'Milestone due',
};
const CELL = { yes: ['●', 'yes'], some: ['◐', 'a bit'], no: ['○', 'no'], excluded: ['·', 'not in that check-in'], none: ['–', 'no check-in'] };
const MONTH_NAMES = Array.from({ length: 12 }, (x, i) => new Date(Date.UTC(2000, i, 1)).toLocaleDateString(undefined, { month: 'long', timeZone: 'UTC' }));
const WEEKDAYS = Array.from({ length: 7 }, (x, i) => new Date(Date.UTC(2023, 0, 1 + i)).toLocaleDateString(undefined, { weekday: 'long', timeZone: 'UTC' }));   // 1 Jan 2023 was a Sunday

function fmtStamp(iso) { return isISO(iso) ? new Date(iso).toLocaleString() : ''; }
// A calendar date, leaving out the year when it is this year.
function fmtDay(s, today) { return fmtYMD(s, isStr(today) && s.slice(0, 4) === today.slice(0, 4) ? { year: undefined } : null); }
// The local calendar date of a timestamp.
function fmtWhen(iso) { return isISO(iso) ? fmtYMD(todayLocal(new Date(iso))) : ''; }
function weekRange(weekKey, today) { return fmtDay(weekKey, today) + ' – ' + fmtDay(addDays(weekKey, 6), today); }
function monthsBetween(fromYM, toYM) {
  return (Number(toYM.slice(0, 4)) - Number(fromYM.slice(0, 4))) * 12 + (Number(toYM.slice(5, 7)) - Number(fromYM.slice(5, 7)));
}
function targetText(targetMonth, today) {
  if (!isYM(targetMonth)) return '';
  const n = monthsBetween(monthOf(today), targetMonth);
  return fmtYM(targetMonth) + ' · ' + (n < 0 ? 'overdue' : n === 0 ? 'this month' : 'in ' + n + (n === 1 ? ' month' : ' months'));
}
function milestoneText(m, today) {
  if (!m.dueDate) return m.text;
  const n = diffDays(today, m.dueDate);
  return m.text + ' · ' + (n < 0 ? 'overdue' : n === 0 ? 'due today' : 'due ' + fmtDay(m.dueDate, today));
}
function statusLabel(g, today) {
  if (g.status === 'parked') return g.revisitOn ? 'Parked · revisit ' + fmtDay(g.revisitOn, today) : 'Parked';
  if (g.status === 'achieved' || g.status === 'dropped') return STATUS_LABEL[g.status] + (g.closedAt ? ' · ' + fmtWhen(g.closedAt) : '');
  return 'Active';
}
function weekKeysEnding(lastWeek, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i -= 1) out.push(addDays(lastWeek, -7 * i));
  return out;
}

/* Where the app is running */
function isInstalled() {
  try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; }
}
function isTouch() {
  try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; }
}
function displayMode() { return isInstalled() ? 'Home Screen app' : 'Browser tab'; }

// Backup reminder (spec 7): there are goals, no backup in 30 days, and the reminder is not snoozed.
function backupDue(doc, now) {
  if (!doc || !doc.goals.length) return false;
  if (doc.settings.backupSnoozeUntil && todayLocal(now) < doc.settings.backupSnoozeUntil) return false;
  if (!doc.settings.lastExportAt) return true;

// One banner at a time (spec 6), most important first. Saving problems show on every screen; revisits,
// the backup reminder and the install tip show on the board.
function topBanner(route) {
  if (APP.store && APP.store.mode === 'memory') {
    return { kind: 'danger', text: 'Not saving: ' + APP.store.memoryReason + ' Anything you change is lost when you close this page.' };
  }
  if (APP.conflict) return { kind: 'warn', text: 'Your data changed in another tab or window.', label: 'Reload', run: () => location.reload() };
  if (APP.boot && APP.boot.repaired && !APP.repairSeen) {
    return { kind: 'info', text: 'Some saved data was repaired when the app started. A copy of the original is under Safety copies in Diagnostics.', label: 'OK', run: () => { APP.repairSeen = true; renderBanners(); } };
  }
  if (route.name !== 'board' || !APP.doc) return null;
  const now = new Date();
  const due = revisitsDue(APP.doc, now);
  if (due.length === 1) return { kind: 'info', text: '"' + due[0].title + '" is due for a revisit.', label: 'Review', run: () => navigate(goalPath(due[0].id)) };
  if (due.length > 1) return { kind: 'info', text: due.length + ' parked goals are due for a revisit.', label: 'Review', run: () => navigate('/shelf') };
  if (APP.demo) return null;

    return {
      kind: 'warn',
      text: APP.doc.settings.lastExportAt ? 'Your last backup is more than 30 days old.' : 'You have not made a backup yet. Your goals live only in this browser.',
      label: 'Back up now', run: () => navigate('/settings/backup'),
      label2: 'Later', run2: () => commit('snoozeBackupReminder', {}),

    return {
      kind: 'info',
      text: 'Tip: add Compass to your Home Screen. It opens like an app, and on iPhone your data is safer there than in Safari.',
      label: 'How', run: showInstallHelp,
